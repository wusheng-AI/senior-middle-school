<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 1 单词听写 · 汉译英</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --indigo:#6366f1;
    --violet:#8b5cf6;
    --ink:#1e293b;
    --muted:#64748b;
    --teal:#14b8a6;
  }
  body{
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 8% 4%, #dbeafe 0%, transparent 60%),
      radial-gradient(820px 520px at 92% 12%, #ede9fe 0%, transparent 58%),
      radial-gradient(900px 620px at 50% 102%, #d1fae5 0%, transparent 62%),
      linear-gradient(135deg,#f0f6ff 0%,#faf5ff 50%,#ecfeff 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:22px;
    color:var(--ink);
    overflow-x:hidden;
  }

  /* ===== 背景漂浮字母 ===== */
  #bgDeco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .bg-letter{
    position:absolute;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    color:rgba(99,102,241,.10);
    animation:floaty ease-in-out infinite;
    user-select:none;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-32px) rotate(8deg);}
  }

  /* ===== 卡片 ===== */
  .card{
    position:relative;z-index:1;
    width:min(620px,100%);
    max-height:94vh;
    overflow-y:auto;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:26px;
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 30px 70px -30px rgba(79,70,229,.48), 0 8px 26px -14px rgba(15,23,42,.18);
    padding:26px 28px 24px;
  }
  .card::-webkit-scrollbar{width:8px;}
  .card::-webkit-scrollbar-thumb{background:#dbe3f5;border-radius:99px;}

  /* ===== 顶部 ===== */
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    width:44px;height:44px;border-radius:14px;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    color:#fff;display:grid;place-items:center;
    font-family:Georgia,serif;font-size:22px;font-weight:700;
    box-shadow:0 10px 22px -10px rgba(99,102,241,.95);
  }
  h1{font-size:17px;font-weight:800;letter-spacing:.2px;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .best-chip{
    font-size:12.5px;font-weight:700;color:#4338ca;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
    border:1px solid #e0e7ff;
    padding:7px 12px;border-radius:999px;white-space:nowrap;
  }

  /* ===== 进度 ===== */
  .progress-wrap{margin-bottom:18px;}
  .progress-track{height:8px;border-radius:99px;background:#e8edf8;overflow:hidden;}
  .progress-fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7);
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;}

  /* ===== 题目 ===== */
  .q-box{
    background:linear-gradient(160deg,#fbfdff,#f4f7ff);
    border:1px solid #e8edfa;
    border-radius:20px;
    padding:22px 22px 20px;
    margin-bottom:16px;
  }
  @keyframes qpop{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
  .q-pop{animation:qpop .28s ease;}
  .pos-tag{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;
    color:#7c3aed;background:#f3e8ff;border-radius:999px;padding:4px 11px;
  }
  .q-zh{
    font-size:25px;font-weight:800;line-height:1.4;
    margin:12px 0 6px;color:#1e293b;letter-spacing:.3px;
  }
  .q-hint{font-size:12.5px;color:#94a3b8;margin-bottom:16px;}
  input.answer{
    width:100%;padding:15px 18px;font-size:20px;border-radius:15px;
    border:2px solid #dbe3f0;background:#f8faff;outline:none;
    transition:.2s;font-family:Georgia,"Segoe UI",serif;letter-spacing:.6px;color:#312e81;
  }
  input.answer::placeholder{font-family:"Segoe UI",sans-serif;font-size:15px;color:#b6c2d6;letter-spacing:0;}
  input.answer:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 5px rgba(99,102,241,.13);}

  /* ===== 题号圆点 ===== */
  .dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
  .dot{
    width:32px;height:32px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;
    color:#94a3b8;font-weight:700;font-size:13px;cursor:pointer;transition:.18s;font-family:inherit;
  }
  .dot:hover{border-color:#a5b4fc;color:#6366f1;transform:translateY(-2px);}
  .dot.done{background:#eef2ff;border-color:#c7d2fe;color:#4f46e5;}
  .dot.active{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border-color:transparent;color:#fff;
    box-shadow:0 8px 18px -8px rgba(99,102,241,.95);
  }

  /* ===== 按钮 ===== */
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
    border-radius:13px;padding:12px 16px;transition:.18s;white-space:nowrap;
  }
  .btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 12px 24px -12px rgba(99,102,241,1);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 28px -12px rgba(99,102,241,1);}
  .btn-ghost{background:#fff;color:#475569;border:1.5px solid #e2e8f0;}
  .btn-ghost:hover{border-color:#c7d2fe;color:#4f46e5;background:#f8faff;}
  .btn-soft{background:#eef2ff;color:#4338ca;}
  .btn-soft:hover{background:#e0e7ff;transform:translateY(-2px);}

  .nav-row{display:flex;gap:10px;margin-bottom:16px;}
  .nav-row .btn{flex:1;}
  .action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  #submitBtn{grid-column:1/-1;}

  /* ===== 结果页 ===== */
  .hidden{display:none!important;}
  .result-top{display:flex;align-items:center;gap:22px;margin-bottom:18px;}
  .ring{
    width:118px;height:118px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;
    background:conic-gradient(#e6ebf5 0deg 360deg);
    transition:background .7s ease;
  }
  .ring-inner{
    width:88px;height:88px;border-radius:50%;background:#fff;
    display:grid;place-items:center;align-content:center;
    box-shadow:inset 0 2px 10px rgba(99,102,241,.14);
  }
  .ring-num{font-size:24px;font-weight:800;color:#4338ca;line-height:1;}
  .ring-label{font-size:11px;color:#94a3b8;margin-top:5px;font-weight:700;}
  .result-info{flex:1;min-width:0;}
  .result-title{font-size:20px;font-weight:800;margin-bottom:6px;}
  .result-sub{font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:600;}
  .compare{display:inline-block;font-size:13px;font-weight:700;padding:8px 13px;border-radius:11px;line-height:1.45;}
  .badge-up{background:#dcfce7;color:#15803d;}
  .badge-down{background:#ffe4e6;color:#be123c;}
  .badge-same{background:#eef2ff;color:#4338ca;}
  .badge-new{background:#fef3c7;color:#b45309;}

  .advice{
    background:linear-gradient(135deg,#f0f9ff,#f5f3ff);
    border:1px solid #e0e7ff;border-radius:16px;padding:14px 16px;
    font-size:13.5px;line-height:1.75;color:#334155;margin-bottom:16px;
  }
  .advice b{color:#4f46e5;}

  .wrong-head{font-weight:800;font-size:14.5px;margin-bottom:10px;}
  .wrong-list{display:flex;flex-direction:column;gap:10px;max-height:262px;overflow-y:auto;padding-right:4px;margin-bottom:16px;}
  .wrong-list::-webkit-scrollbar{width:6px;}
  .wrong-list::-webkit-scrollbar-thumb{background:#fecdd3;border-radius:99px;}
  #wrongBox.collapsed .wrong-list{display:none;}
  .wrong-item{background:#fff5f5;border-left:4px solid #fb7185;border-radius:12px;padding:12px 14px;}
  .wi-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .wi-en{font-size:16px;font-weight:800;color:#be123c;font-family:Georgia,serif;}
  .wi-pos{font-size:11.5px;font-weight:700;color:#e11d48;background:#ffe4e6;padding:2px 8px;border-radius:999px;}
  .wi-zh{font-size:13px;color:#475569;margin-top:5px;}
  .wi-ans{font-size:12.5px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;}
  .wi-your{color:#be123c;}
  .wi-ok{color:#15803d;}
  .wi-your b,.wi-ok b{font-family:Georgia,serif;font-size:13.5px;}
  .all-correct{
    background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;font-weight:700;
    border-radius:14px;padding:14px 16px;font-size:14px;margin-bottom:16px;text-align:center;
  }
  .result-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  #retryBtn{grid-column:1/-1;order:-1;}

  /* ===== 弹窗 ===== */
  .modal-mask{
    position:fixed;inset:0;z-index:50;
    background:rgba(30,41,59,.34);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    width:min(640px,100%);max-height:82vh;background:#fff;border-radius:22px;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(15,23,42,.42);
    animation:pop .26s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid #eef2f7;
    background:linear-gradient(135deg,#f8faff,#f5f3ff);
  }
  .modal-head h2{font-size:16px;font-weight:800;}
  .close-btn{
    width:32px;height:32px;border-radius:10px;border:none;cursor:pointer;
    background:#fff;color:#64748b;font-size:15px;font-weight:700;
    box-shadow:0 2px 8px rgba(15,23,42,.09);transition:.15s;
  }
  .close-btn:hover{background:#fee2e2;color:#dc2626;}
  .modal-body{padding:20px 22px;overflow-y:auto;}
  .modal-body::-webkit-scrollbar{width:7px;}
  .modal-body::-webkit-scrollbar-thumb{background:#dbe3f5;border-radius:99px;}

  .bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .bank-item{background:#f8faff;border:1px solid #eef2fb;border-radius:12px;padding:10px 13px;transition:.16s;}
  .bank-item:hover{background:#eef2ff;border-color:#c7d2fe;transform:translateY(-2px);}
  .bank-en{font-family:Georgia,serif;font-weight:700;font-size:15px;color:#4338ca;}
  .bank-zh{font-size:12.5px;color:#64748b;margin-top:3px;line-height:1.5;}

  .his-list{display:flex;flex-direction:column;gap:9px;}
  .his-item{
    display:grid;grid-template-columns:44px 62px 1fr auto auto;
    align-items:center;gap:10px;
    background:#f8faff;border:1px solid #eef2fb;border-radius:12px;
    padding:11px 14px;font-size:13px;
  }
  .his-item.best{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a;}
  .his-idx{color:#94a3b8;font-weight:700;}
  .his-score{font-weight:800;color:#4338ca;font-size:15px;}
  .his-detail{color:#64748b;}
  .his-time{color:#94a3b8;font-size:12px;}
  .his-tag{background:#f59e0b;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;}
  .empty{color:#94a3b8;font-size:14px;text-align:center;padding:26px 0;}

  @media (max-width:520px){
    .card{padding:20px 16px;border-radius:20px;}
    .q-zh{font-size:21px;}
    .bank-grid{grid-template-columns:1fr;}
    .result-top{flex-direction:column;align-items:flex-start;gap:14px;}
    .result-actions{grid-template-columns:1fr 1fr;}
    #retryBtn{grid-column:1/-1;}
    .his-item{grid-template-columns:34px 54px 1fr;row-gap:4px;}
    .his-time{grid-column:2/4;font-size:11px;}
  }
</style>
</head>
<body>

<div id="bgDeco"></div>

<div class="card" id="card">

  <!-- ========== 头部 ========== -->
  <div class="head">
    <div class="brand">
      <div class="logo">L1</div>
      <div>
        <h1>Lesson 1 单词听写</h1>
        <p class="sub">高中英语 · 汉译英 · 每轮随机 15 题</p>
      </div>
    </div>
    <div class="best-chip" id="bestChip">🏆 历史最高：—</div>
  </div>

  <!-- ========== 答题区 ========== -->
  <section id="quizView">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text">
        <span id="progressText">1 / 15</span>
        <span id="answeredText">已答 0</span>
      </div>
    </div>

    <div class="q-box" id="qBox">
      <span class="pos-tag" id="posTag">n.</span>
      <div class="q-zh" id="qZh">校园</div>
      <div class="q-hint">请写出对应的英文单词 / 短语</div>
      <input class="answer" id="answerInput" type="text" placeholder="Type the English word..." autocomplete="off" spellcheck="false">
    </div>

    <div class="dots" id="dots"></div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="prevBtn">← 上一题</button>
      <button class="btn btn-ghost" id="nextBtn">下一题 →</button>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" id="submitBtn">✅ 提交并评分</button>
      <button class="btn btn-soft" id="shuffleBtn">🔄 重新随机</button>
      <button class="btn btn-soft" id="bankBtn">📚 题库</button>
      <button class="btn btn-soft" id="historyBtn">📈 历史</button>
    </div>
  </section>

  <!-- ========== 结果区 ========== -->
  <section id="resultView" class="hidden">
    <div class="result-top">
      <div class="ring" id="ring">
        <div class="ring-inner">
          <span class="ring-num" id="ringNum">0%</span>
          <span class="ring-label">正确率</span>
        </div>
      </div>
      <div class="result-info">
        <div class="result-title" id="resultTitle">完成！</div>
        <div class="result-sub" id="resultSub">答对 0 / 15 题</div>
        <div class="compare" id="compareChip">—</div>
      </div>
    </div>

    <div class="advice" id="adviceBox"></div>

    <div id="wrongBox"></div>

    <div class="result-actions">
      <button class="btn btn-primary" id="retryBtn">🔄 再来一轮（重新随机）</button>
      <button class="btn btn-soft" id="wrongBtn">👀 查看错题</button>
      <button class="btn btn-soft" id="bankBtn2">📚 题库</button>
      <button class="btn btn-soft" id="historyBtn2">📈 历史分数</button>
    </div>
  </section>

</div>

<!-- ========== 弹窗 ========== -->
<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">题库</h2>
      <button class="close-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* ================= 题库数据（Lesson 1 · 39 个） ================= */
const WORDS = [
  { en:'teen',              zh:'少年，十几岁的孩子',                  pos:'n.' },
  { en:'laptop',            zh:'笔记本电脑，便携式电脑',               pos:'n.' },
  { en:'digital',           zh:'数字的，数码的',                      pos:'adj.' },
  { en:'native',            zh:'本地人',                             pos:'n.' },
  { en:'range',             zh:'一系列；范围',                        pos:'n.' },
  { en:'various',           zh:'各种各样的；多种（类型）的',            pos:'adj.' },
  { en:'hardware',          zh:'(计算机)硬件',                        pos:'n.' },
  { en:'necessity',         zh:'必需品',                             pos:'n.' },
  { en:'convenient',        zh:'方便的，便利的',                      pos:'adj.' },
  { en:'quality',           zh:'质量，品质',                          pos:'n.' },
  { en:'from time to time', zh:'有时；偶尔；间或',                    pos:'phrase' },
  { en:'living room',       zh:'起居室',                             pos:'phrase' },
  { en:'addict',            zh:'对……着迷的人',                       pos:'n.' },
  { en:'according to',      zh:'按……所说，根据',                     pos:'phrase' },
  { en:'in person',         zh:'亲自',                               pos:'phrase' },
  { en:'media',             zh:'新闻媒体，大众传播媒介(总称)',          pos:'n.' },
  { en:'social media',      zh:'社交媒体',                            pos:'phrase' },
  { en:'actually',          zh:'实际上，事实上',                      pos:'adv.' },
  { en:'drag',              zh:'拖，拉',                             pos:'vt.' },
  { en:'tend to do sth',    zh:'易于做某事',                          pos:'phrase' },
  { en:'goal',              zh:'目标，目的',                          pos:'n.' },
  { en:'aim',               zh:'目的，意图；力求达到',                 pos:'n.&vi.' },
  { en:'target',            zh:'目标',                               pos:'n.' },
  { en:'update',            zh:'更新',                               pos:'vt.' },
  { en:'meanwhile',         zh:'与此同时',                            pos:'adv.' },
  { en:'distance',          zh:'距离，间距',                          pos:'n.' },
  { en:'volunteer',         zh:'自愿；志愿；志愿者',                   pos:'vi.&vt.&n.' },
  { en:'revise',            zh:'复习',                               pos:'vi.&vt.' },
  { en:'saying',            zh:'格言，谚语',                          pos:'n.' },
  { en:'ahead',             zh:'在前面；向前',                        pos:'adv.' },
  { en:'get ahead',         zh:'取得进步，获得成功',                   pos:'phrase' },
  { en:'lifestyle',         zh:'生活方式',                            pos:'n.' },
  { en:'chat',              zh:'闲谈，聊天',                          pos:'vi.&n.' },
  { en:'surf',              zh:'冲浪',                               pos:'vi.&vt.' },
  { en:'surf the Internet', zh:'网上冲浪，浏览因特网',                 pos:'phrase' },
  { en:'voluntary',         zh:'志愿的；服务的；自愿的',                pos:'adj.' },
  { en:'engine',            zh:'引擎',                               pos:'n.' },
  { en:'search engine',     zh:'搜索引擎',                            pos:'phrase' },
  { en:'definitely',        zh:'确切地，肯定地',                      pos:'adv.' }
];

const Q_COUNT = 15;
const STORAGE_KEY = 'lesson1_dictation_history';

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const isTouch = window.matchMedia('(hover: none)').matches;

function normalize(s){
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function pad(n){ return n < 10 ? '0' + n : '' + n; }

/* ================= 状态 ================= */
let quiz = [];
let answers = [];
let idx = 0;
let submitted = false;
let lastResults = [];

/* ================= 历史记录 ================= */
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveRecord(rec){
  const h = loadHistory();
  h.push({ ...rec, time: new Date().toISOString() });
  if(h.length > 200) h.splice(0, h.length - 200);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
}
function bestPercent(){
  const h = loadHistory();
  return h.length ? Math.max(...h.map(x => x.percent)) : null;
}
function updateBestChip(){
  const b = bestPercent();
  $('bestChip').textContent = b === null ? '🏆 历史最高：—' : `🏆 历史最高：${b}%`;
}

/* ================= 出题 ================= */
function newQuiz(){
  quiz = shuffle(WORDS).slice(0, Math.min(Q_COUNT, WORDS.length));
  answers = new Array(quiz.length).fill('');
  idx = 0;
  submitted = false;
  lastResults = [];

  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  render();
  if(!isTouch) $('answerInput').focus();
}

function render(){
  const w = quiz[idx];
  $('posTag').textContent = w.pos;
  $('qZh').textContent = w.zh;
  $('answerInput').value = answers[idx] || '';

  $('progressText').textContent = `${idx + 1} / ${quiz.length}`;
  $('progressFill').style.width = ((idx + 1) / quiz.length * 100) + '%';

  renderDots();
  updateAnsweredCount();

  $('prevBtn').disabled = idx === 0;
  $('nextBtn').disabled = idx === quiz.length - 1;

  const box = $('qBox');
  box.classList.remove('q-pop');
  void box.offsetWidth;
  box.classList.add('q-pop');

  if(!isTouch) $('answerInput').focus();
}

function renderDots(){
  const wrap = $('dots');
  wrap.innerHTML = '';
  quiz.forEach((w, i) => {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'dot' + (i === idx ? ' active' : '') + ((answers[i] || '').trim() ? ' done' : '');
    d.textContent = i + 1;
    d.title = (answers[i] || '').trim() ? '已作答' : '未作答';
    d.addEventListener('click', () => { idx = i; render(); });
    wrap.appendChild(d);
  });
}

function updateAnsweredCount(){
  const n = answers.filter(a => (a || '').trim()).length;
  $('answeredText').textContent = `已答 ${n} / ${quiz.length}`;
}

/* ================= 交互 ================= */
$('answerInput').addEventListener('input', e => {
  answers[idx] = e.target.value;
  const dots = $('dots').children;
  if(dots[idx]) dots[idx].classList.toggle('done', !!e.target.value.trim());
  updateAnsweredCount();
});

$('answerInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(idx < quiz.length - 1){ idx++; render(); }
    else { submit(); }
  }
});

$('prevBtn').addEventListener('click', () => { if(idx > 0){ idx--; render(); } });
$('nextBtn').addEventListener('click', () => { if(idx < quiz.length - 1){ idx++; render(); } });

$('shuffleBtn').addEventListener('click', () => {
  newQuiz();
});

$('submitBtn').addEventListener('click', submit);
$('retryBtn').addEventListener('click', newQuiz);

$('wrongBtn').addEventListener('click', () => {
  const box = $('wrongBox');
  if(!box.querySelector('.wrong-list')) return;
  box.classList.toggle('collapsed');
  $('wrongBtn').textContent = box.classList.contains('collapsed') ? '👀 查看错题' : '🙈 收起错题';
});

$('bankBtn').addEventListener('click', showBank);
$('bankBtn2').addEventListener('click', showBank);
$('historyBtn').addEventListener('click', showHistory);
$('historyBtn2').addEventListener('click', showHistory);

/* ================= 提交评分 ================= */
function submit(){
  if(submitted) return;
  submitted = true;

  const results = quiz.map((w, i) => {
    const user = (answers[i] || '').trim();
    const ok = normalize(user) === normalize(w.en);
    return { en: w.en, zh: w.zh, pos: w.pos, user, correct: ok };
  });

  const correctCount = results.filter(r => r.correct).length;
  const percent = Math.round(correctCount / results.length * 100);
  const prevBest = bestPercent();          // 提交前的历史最高分

  lastResults = results;

  saveRecord({ percent, correct: correctCount, total: results.length });

  renderResult(results, correctCount, percent, prevBest);
}

function renderResult(results, correctCount, percent, prevBest){
  $('quizView').classList.add('hidden');
  $('resultView').classList.remove('hidden');

  /* --- 圆环 --- */
  const deg = percent * 3.6;
  $('ring').style.background =
    `conic-gradient(from -90deg, #6366f1 0deg, #a855f7 ${deg}deg, #e6ebf5 ${deg}deg 360deg)`;
  $('ringNum').textContent = percent + '%';

  /* --- 标题 --- */
  let title;
  if(percent === 100) title = '🎉 完美满分！';
  else if(percent >= 80) title = '👍 表现优秀！';
  else if(percent >= 60) title = '🙂 继续加油';
  else title = '💪 需要复习';
  $('resultTitle').textContent = title;
  $('resultSub').textContent = `答对 ${correctCount} / ${results.length} 题`;

  /* --- 历史最高分对比 --- */
  const chip = $('compareChip');
  if(prevBest === null){
    chip.className = 'compare badge-new';
    chip.textContent = `🆕 首次测试，本次 ${percent}% 已设为起始分数`;
  } else if(percent > prevBest){
    chip.className = 'compare badge-up';
    chip.textContent = `📈 相比历史最高分上升了 ${percent - prevBest} 分（原最高 ${prevBest}%）`;
  } else if(percent < prevBest){
    chip.className = 'compare badge-down';
    chip.textContent = `📉 相比历史最高分下降了 ${prevBest - percent} 分（原最高 ${prevBest}%）`;
  } else {
    chip.className = 'compare badge-same';
    chip.textContent = `➖ 与历史最高分持平（${prevBest}%）`;
  }

  /* --- 建议 --- */
  const wrong = results.filter(r => !r.correct);
  let advice;
  if(percent === 100){
    advice = '太棒了！<b>全部正确</b>，这些词汇你已经掌握得很扎实，继续保持这种状态吧！';
  } else if(percent >= 80){
    advice = '整体不错！只差一点点就满分了。<b>建议把下面的错题抄写 3 遍并大声朗读</b>，加深拼写记忆。';
  } else if(percent >= 60){
    advice = '基础还可以，但仍有明显漏洞。<b>建议先复习错题的拼写规律</b>（注意词尾、元音组合），再进行下一轮测试。';
  } else {
    advice = '需要加强哦！<b>建议先打开「题库」通读一遍全部单词</b>，逐个朗读并默写，然后再重新测试，反复巩固效果更好。';
  }
  if(wrong.length){
    advice += `<br>本轮需重点复习：<b>${wrong.map(w => esc(w.en)).join('、')}</b>`;
  }
  $('adviceBox').innerHTML = advice;

  /* --- 错题区 --- */
  const box = $('wrongBox');
  if(wrong.length === 0){
    box.classList.remove('collapsed');
    box.innerHTML = `<div class="all-correct">✅ 全部答对，没有错题！</div>`;
    $('wrongBtn').style.display = 'none';
  } else {
    box.classList.remove('collapsed');
    box.innerHTML = `
      <div class="wrong-head">❌ 错题回顾（${wrong.length} 题）</div>
      <div class="wrong-list">
        ${wrong.map(w => `
          <div class="wrong-item">
            <div class="wi-top">
              <span class="wi-en">${esc(w.en)}</span>
              <span class="wi-pos">${esc(w.pos)}</span>
            </div>
            <div class="wi-zh">${esc(w.zh)}</div>
            <div class="wi-ans">
              <span class="wi-your">你的答案：<b>${w.user ? esc(w.user) : '（未作答）'}</b></span>
              <span class="wi-ok">正确拼写：<b>${esc(w.en)}</b></span>
            </div>
          </div>`).join('')}
      </div>`;
    $('wrongBtn').style.display = '';
    $('wrongBtn').textContent = '🙈 收起错题';
  }

  updateBestChip();
  $('card').scrollTop = 0;
}

/* ================= 弹窗 ================= */
function openModal(title, html){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  $('modalMask').classList.remove('hidden');
  $('modalBody').scrollTop = 0;
}
function closeModal(){
  $('modalMask').classList.add('hidden');
}

$('modalClose').addEventListener('click', closeModal);
$('modalMask').addEventListener('click', e => { if(e.target === $('modalMask')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function showBank(){
  const html = `<div class="bank-grid">
    ${WORDS.map((w, i) => `
      <div class="bank-item">
        <div class="bank-en">${i + 1}. ${esc(w.en)}</div>
        <div class="bank-zh">${esc(w.pos)} ${esc(w.zh)}</div>
      </div>`).join('')}
  </div>`;
  openModal(`📚 完整题库（共 ${WORDS.length} 个）`, html);
}

function showHistory(){
  const h = loadHistory();
  if(!h.length){
    openModal('📈 历史分数', '<p class="empty">还没有任何记录，先完成一次测试吧！</p>');
    return;
  }
  const best = Math.max(...h.map(x => x.percent));
  const list = h.slice().reverse().map((rec, i) => {
    const d = new Date(rec.time);
    const dateStr = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const isBest = rec.percent === best;
    return `<div class="his-item ${isBest ? 'best' : ''}">
      <span class="his-idx">#${h.length - i}</span>
      <span class="his-score">${rec.percent}%</span>
      <span class="his-detail">答对 ${rec.correct}/${rec.total}</span>
      <span class="his-time">${dateStr}</span>
      ${isBest ? '<span class="his-tag">最高</span>' : '<span></span>'}
    </div>`;
  }).join('');
  openModal(`📈 历史分数（共 ${h.length} 次，最高 ${best}%）`, `<div class="his-list">${list}</div>`);
}

/* ================= 背景装饰 ================= */
(function makeDeco(){
  const chars = ['A','B','C','D','E','F','G','H','K','L','M','R','S','T','W','a','b','c','d','e','g','k','s','y'];
  const frag = document.createDocumentFragment();
  for(let i = 0; i < 20; i++){
    const s = document.createElement('span');
    s.className = 'bg-letter';
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.left = (Math.random() * 96) + 'vw';
    s.style.top = (Math.random() * 94) + 'vh';
    s.style.fontSize = (38 + Math.random() * 92) + 'px';
    s.style.animationDuration = (9 + Math.random() * 9) + 's';
    s.style.animationDelay = (-Math.random() * 10) + 's';
    s.style.opacity = (0.5 + Math.random() * 0.6).toFixed(2);
    frag.appendChild(s);
  }
  $('bgDeco').appendChild(frag);
})();

/* ================= 启动 ================= */
updateBestChip();
newQuiz();
</script>
</body>
</html>
