<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#16233d;--muted:#64748b;--line:#dbe6f7;--primary:#3b5bfd;--primary2:#6d5efc;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--card:#fff;--shadow:0 12px 34px rgba(35,73,163,.10),0 2px 8px rgba(35,73,163,.06);}

.bg-symbols span{position:absolute;font-family:"Times New Roman",Georgia,serif;font-size:110px;color:rgba(59,91,253,.055);animation:float 20s ease-in-out infinite;}
.bg-symbols span:nth-child(1){left:3%;top:10%;animation-delay:0s}.bg-symbols span:nth-child(2){left:88%;top:16%;animation-delay:-3s}.bg-symbols span:nth-child(3){left:12%;top:72%;animation-delay:-6s}.bg-symbols span:nth-child(4){left:78%;top:64%;animation-delay:-9s}.bg-symbols span:nth-child(5){left:45%;top:6%;animation-delay:-12s;font-size:80px}.bg-symbols span:nth-child(6){left:60%;top:86%;animation-delay:-5s;font-size:86px}.bg-symbols span:nth-child(7){left:28%;top:44%;animation-delay:-14s;font-size:70px}.bg-symbols span:nth-child(8){left:92%;top:44%;animation-delay:-8s;font-size:74px}

.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}

.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid #d6e2ff;box-shadow:0 2px 8px rgba(59,91,253,.09);}

.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none;}
.btn.big{padding:15px 40px;font-size:16.5px;border-radius:16px;}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);border:1px solid #e8f0ff;padding:28px 30px;animation:fadeUp .32s ease;}

.qnum{font-weight:800;font-size:15px;color:var(--primary);letter-spacing:.5px;}
.qtag{font-size:12.5px;color:#0e7490;background:#e0f7fb;border:1px solid #b6ecf5;padding:4px 13px;border-radius:999px;font-weight:700;white-space:nowrap;}

.opt:hover{border-color:#b9cdff;background:#f1f7ff;transform:translateX(4px);}
.opt.sel{border-color:var(--primary);background:linear-gradient(135deg,#eef4ff,#e4edff);box-shadow:0 8px 20px rgba(59,91,253,.16);}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;}

.score-inner{position:relative;text-align:center;}
.score-num{display:block;font-size:41px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;}

.result-info{flex:1;min-width:280px;}
.result-info h2{font-size:24px;margin-bottom:6px;}

.history-compare.up{background:#eafaf2;border-color:#bdf0d7;color:#047857;}
.history-compare.down{background:#fef2f2;border-color:#fbd5d5;color:#b91c1c;}
.history-compare.same{background:#fff8e6;border-color:#fde8ac;color:#b45309;}
.review-head{display:flex;justify-content:space-between;align-items:center;margin:32px 0 16px;flex-wrap:wrap;gap:12px;}
.review-head h3{font-size:18px;}
.filters{display:flex;gap:9px;flex-wrap:wrap;}
.chip{border:1.5px solid #dbe6ff;background:#fff;color:var(--muted);padding:8px 17px;border-radius:999px;font-size:13.5px;cursor:pointer;font-weight:700;font-family:inherit;transition:.15s;}

.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(59,91,253,.3);}

.review-item.is-ok{border-left:6px solid var(--ok);background:#fbfffd;}

.is-ok .ri-badge{background:#d1fae5;color:#047857;}
.ri-q{font-size:16.5px;font-weight:600;line-height:1.75;margin-bottom:13px;}
.ri-opts{display:grid;gap:8px;margin-bottom:13px;}
.ri-opt{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;border:1.5px solid #e8eefb;background:#fff;font-size:15px;line-height:1.55;}

.ri-opt.right{border-color:#9fe6c8;background:#effcf6;}
.ri-opt.right .badge{background:var(--ok);color:#fff;border-color:var(--ok);}
.ri-opt.wrong{border-color:#fbb6b6;background:#fff1f1;}
.ri-opt.wrong .badge{background:var(--bad);color:#fff;border-color:var(--bad);}

.ri-opt em.u{background:#fee2e2;color:#b91c1c;}
.ri-exp{font-size:14.5px;line-height:1.85;background:#f5f9ff;border:1px dashed #cfe0ff;border-radius:13px;padding:13px 16px;margin-bottom:9px;}
.ri-tip{font-size:14px;line-height:1.75;color:#8a5a00;background:#fffbeb;border:1px dashed #fcd97a;border-radius:13px;padding:12px 16px;}
.result-actions{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap;}
.math sup{font-size:.72em;vertical-align:super;line-height:0;}
.math sub{font-size:.72em;vertical-align:sub;line-height:0;}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .14em;font-size:.92em;line-height:1.08;}
.frac .num{border-bottom:1.6px solid currentColor;padding:0 .2em;}
.frac .den{padding:0 .2em;}
.modal{position:fixed;inset:0;background:rgba(23,43,90,.44);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;z-index:60;padding:26px 16px;}
.modal.open{display:block;animation:fadeUp .22s ease;}
.modal-card{max-width:940px;height:100%;margin:0 auto;background:#fff;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(20,40,90,.38);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#f4f8ff,#e9f1ff);}
.modal-head h3{font-size:17px;}
.close{border:none;background:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.09);transition:.15s;}
.close:hover{color:var(--bad);transform:rotate(90deg);}
.modal-body{flex:1;overflow-y:auto;padding:22px 24px 46px;}
.modal-body::-webkit-scrollbar{width:9px;}
.modal-body::-webkit-scrollbar-thumb{background:#cddcff;border-radius:9px;}
.modal-body::-webkit-scrollbar-track{background:#f2f6ff;}
@media (max-width:640px){body{padding:16px 10px 60px;}.card{padding:20px 16px;border-radius:18px;}.qtext{font-size:18px;}.opt{font-size:15.5px;padding:13px 14px;}.score-ring{width:140px;height:140px;}.score-num{font-size:33px;}.bg-symbols span{font-size:70px;}}
</style>
</head>

<script>
/* ===== ① LaTeX → 数学公式渲染引擎 ===== */
const SYM={notin:'∉',subseteq:'⊆',subset:'⊂',supseteq:'⊇',supset:'⊃',emptyset:'∅',varnothing:'∅',cup:'∪',cap:'∩',setminus:'∖',forall:'∀',exists:'∃',nexists:'∄',ge:'≥',geq:'≥',geqslant:'≥',le:'≤',leq:'≤',leqslant:'≤',ne:'≠',neq:'≠',equiv:'≡',approx:'≈',sim:'∼',times:'×',div:'÷',cdot:'·',pm:'±',mp:'∓',Rightarrow:'⇒',rightarrow:'→',to:'→',Leftarrow:'⇐',Leftrightarrow:'⇔',leftrightarrow:'↔',Longrightarrow:'⟹',Longleftrightarrow:'⟺',infty:'∞',pi:'π',alpha:'α',beta:'β',theta:'θ',gamma:'γ',delta:'δ',lambda:'λ',mu:'μ',sigma:'σ',omega:'ω',neg:'¬',lnot:'¬',land:'∧',wedge:'∧',lor:'∨',vee:'∨',angle:'∠',parallel:'∥',perp:'⊥',triangle:'△',circ:'∘',prime:'′',quad:' ',qquad:' ',',':' ',';':' ',' ':' '};

function tex(input){
  if(input===null||input===undefined)return'';
  let s=String(input);
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/\$/g,'');
  s=s.replace(/\\mathbb\s*\{([A-Za-z])\}/g,(m,c)=>BB[c]||c);
  let guard=0;const fracRe=/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/;
  while(fracRe.test(s)&&guard++<40){s=s.replace(fracRe,(m,n,d)=>'<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>');}

  s=s.replace(/\\([a-zA-Z]+)/g,(m,name)=>(SYM[name]!==undefined?SYM[name]:m));
  s=s.split('\\{').join('{').split('\\}').join('}');
  s=s.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>');
  s=s.replace(/\^([0-9a-zA-Z])/g,'<sup>$1</sup>');
  s=s.replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>');
  s=s.replace(/_([0-9a-zA-Z])/g,'<sub>$1</sub>');
  s=s.replace(/\\\\/g,'<br>');
  return s;
}
/* ===== ② 200题题库 ===== */
const BANK=[
/* ===== 1.1 集合的概念（35题） ===== */
{t:'集合的概念',q:'下列各组对象能构成集合的是（　）',o:['著名的数学家','很大的实数','所有的正整数','好吃的食物'],a:2,e:'集合元素必须具有确定性。“著名”“很大”“好吃”缺乏客观标准；而“所有的正整数”是明确确定的整体，可以构成集合。'},
{t:'集合的概念',q:'集合 {x∈ℕ | 1<x<4} 用列举法表示为（　）',o:['{1, 2, 3, 4}','{2, 3}','{2, 3, 4}','{1, 2, 3}'],a:1,e:'ℕ 为自然数集，满足 1<x<4 的自然数只有 2 和 3，故用列举法表示为 {2, 3}。'},
{t:'集合的概念',q:'下列关系正确的是（　）',o:['0∈∅','0∉ℕ','π∈ℚ','√2∈ℝ'],a:3,e:'空集不含任何元素，故 0∉∅；0 是自然数，故 0∈ℕ；π 是无理数，故 π∉ℚ；√2 是实数，故 √2∈ℝ。只有 D 正确。'},
{t:'集合的概念',q:'用描述法表示“所有偶数”组成的集合，正确的是（　）',o:['{x | x=2n, n∈ℕ}','{x | x=2n, n∈ℤ}','{x | x=2n+1, n∈ℤ}','{x | x=2n, n∈ℝ}'],a:1,e:'偶数包含正偶数、0 与负偶数，故 n 应取遍整数，即 {x | x=2n, n∈ℤ}。若 n∈ℕ 则只含非负偶数，不完整。'},
{t:'集合的概念',q:'已知集合 A={x | x²=x}，则集合 A 中元素的个数为（　）',o:['0','1','2','3'],a:2,e:'由 x²=x 得 x(x−1)=0，解得 x=0 或 x=1，故 A={0, 1}，元素个数为 2。'},
{t:'集合的概念',q:'若 {a, b} = {b, a}，这体现了集合元素的（　）',o:['确定性','互异性','无序性','任意性'],a:2,e:'集合中的元素排列顺序不影响集合本身，这体现的是集合元素的“无序性”。'},
{t:'集合的概念',q:'下列集合中是空集的是（　）',o:['{x | x²=0, x∈ℝ}','{x | x²+1=0, x∈ℝ}','{x | x²−1=0, x∈ℝ}','{0}'],a:1,e:'x²+1=0 在实数范围内无解，故 {x | x²+1=0, x∈ℝ} 是空集；其余集合分别含 0、±1 或元素 0。'},
{t:'集合的概念',q:'用列举法表示集合 {x∈ℤ | −2≤x<2} 为（　）',o:['{−2, −1, 0, 1}','{−2, −1, 0, 1, 2}','{−1, 0, 1}','{−1, 0, 1, 2}'],a:0,e:'整数 x 满足 −2≤x<2，即 x 取 −2、−1、0、1，注意右端为开区间，2 不取。'},
{t:'集合的概念',q:'下列说法正确的是（　）',o:['集合 {1, 2} 和集合 {2, 1} 是不同的集合','方程 x²−2x+1=0 的解集是 {1, 1}','0∈ℕ*','空集是任何集合的子集'],a:3,e:'集合具有无序性，{1,2} 与 {2,1} 相同；集合元素具有互异性，{1,1} 应写作 {1}；ℕ* 为正整数集，不含 0；空集是任何集合的子集，D 正确。'},
{t:'集合的概念',q:'集合 {x | x²−2=0, x∈ℚ} 中元素的个数为（　）',o:['0','1','2','3'],a:0,e:'x²−2=0 的解为 x=±√2，均为无理数，不属于有理数集 ℚ，故该集合为空集，元素个数为 0。'},
{t:'集合的概念',q:'下列四个集合中，与另外三个不同的是（　）',o:['{y | y=2}','{x=2}','{2}','{x | x²−4x+4=0}'],a:1,e:'{y | y=2}、{2}、{x | x²−4x+4=0} 都表示数集 {2}；而 {x=2} 表示“方程 x=2”所构成的集合（写法不规范），与其他三个含义不同。'},
{t:'集合的概念',q:'已知集合 A={1, a}，若 2∈A，则 a 的值为（　）',o:['1','2','3','4'],a:1,e:'由 2∈A 且 A={1, a}，根据元素互异性知 a 只能等于 2。'},
{t:'集合的概念',q:'用描述法表示不等式 x−3>0 的解集，正确的是（　）',o:['{x | x>3}','{x | x<3}','{x | x≥3}','{x | x≤3}'],a:0,e:'由 x−3>0 得 x>3，故解集为 {x | x>3}。'},

{t:'量词与否定',q:'下列命题中，是存在量词命题且为真命题的是（　）',o:['∀x∈ℝ，x²≥0','∃x∈ℝ，x²=2','∃x∈ℝ，x²<0','∀x∈ℝ，x+1>0'],a:1,e:'A、D 为全称命题；C 是存在命题但为假（任何实数平方非负）；B 是存在命题，且 √2 满足 x²=2，为真。'},

/* ===== 综合与应用（10题） ===== */
{t:'集合的概念',q:'下列集合中，是空集的是（　）',o:['{x | x²+1=0, x∈ℝ}','{x | x²=0, x∈ℝ}','{x | x²−1=0, x∈ℝ}','{x | x²=x, x∈ℝ}'],a:0,e:'x²+1=0 在实数范围内无解；B、C、D 分别有解 0、±1、0 和 1。'},
{t:'集合间的关系',q:'集合 {1, 2, 3, 4} 的真子集个数为（　）',o:['14','15','16','17'],a:1,e:'含 4 个元素的集合真子集个数为 2⁴−1=15 个。'},
{t:'集合的运算',q:'已知 A={x | x²−1=0}，B={x | x²−3x+2=0}，则 A∪B=（　）',o:['{−1, 1, 2}','{1, 2}','{−1, 1}','{−1, 2}'],a:0,e:'A={−1, 1}，B={1, 2}，故 A∪B={−1, 1, 2}。'},
{t:'充分必要条件',q:'“x²=1”是“x=−1”的（　）',o:['充分不必要条件','必要不充分条件','充要条件','既不充分也不必要条件'],a:1,e:'x²=1 推不出 x=−1（可能 x=1）；但 x=−1 必有 x²=1。故为必要不充分条件。'},
{t:'量词与否定',q:'命题“∀x∈ℝ，x²−2x+3>0”的否定是（　）',o:['∃x∈ℝ，x²−2x+3≤0','∃x∈ℝ，x²−2x+3<0','∀x∈ℝ，x²−2x+3≤0','∀x∈ℝ，x²−2x+3<0'],a:0,e:'全称命题的否定：∀ 改 ∃，“>0”取反为“≤0”，得 ∃x∈ℝ，x²−2x+3≤0。'},
{t:'集合的运算',q:'设全集 U={1, 2, 3, 4, 5, 6, 7}，A={1, 3, 5, 7}，则 ∁UA 中元素的个数为（　）',o:['2','3','4','5'],a:1,e:'∁UA={2, 4, 6}，共 3 个元素。'},
{t:'集合间的关系',q:'设 A={x | x 是平行四边形}，B={x | x 是梯形}，则（　）',o:['A⊆B','B⊆A','A=B','互不包含'],a:3,e:'平行四边形与梯形是两类不同的四边形，互不包含。'},
{t:'充分必要条件',q:'“x>0 且 y>0”是“xy>0”的（　）',o:['充分不必要条件','必要不充分条件','充要条件','既不充分也不必要条件'],a:0,e:'x>0 且 y>0 必有 xy>0；但 xy>0 时 x、y 可以都小于 0。故为充分不必要条件。'},
{t:'量词与否定',q:'命题“有些自然数是质数”的否定是（　）',o:['有些自然数不是质数','所有自然数都是质数','所有自然数都不是质数','存在自然数是质数'],a:2,e:'“有些是”的否定是“所有都不是”，即所有自然数都不是质数。'},
{t:'集合的概念',q:'已知集合 A={x | x=2n, n∈ℤ}，B={x | x=4n, n∈ℤ}，则 A 与 B 的关系是（　）',o:['A⊆B','B⊆A','A=B','互不包含'],a:1,e:'B 是 4 的倍数集，A 是 2 的倍数集，4 的倍数一定是 2 的倍数，故 B⊆A。'}
];

/* ===== ③ 学习建议 ===== */
const TIPS={
'集合的概念':'牢记集合元素的三大特性：确定性、互异性、无序性；注意区分数集（ℕ、ℤ、ℚ、ℝ）与点集，注意 0 与 ∅ 的区别。',
'集合间的关系':'熟记：空集是任何集合的子集；含 n 个元素的集合有 2ⁿ 个子集、2ⁿ−1 个真子集、2ⁿ−2 个非空真子集。判断包含关系时优先画数轴或 Venn 图。',
'集合的运算':'交集找"公共"，并集求"合并"，补集是"全集内除去"。含参数时务必借助数轴，注意端点值能否取到（开闭区间）。',
'充分必要条件':'口诀："小范围推大范围"。若 p 的范围是 q 的子集，则 p 是 q 的充分条件。判断时先明确谁推谁，再举反例验证。',
'量词与否定':'否定口诀："量词互换、结论取反"：∀ 变 ∃，∃ 变 ∀，同时把结论中的 >、<、≥、≤、= 全部取反。'
};

/* ===== ④ 应用状态与逻辑 ===== */
const TOTAL=30;
const HISTORY_KEY='setLogicQuiz200History';
const LETTERS=['A','B','C','D'];
let state={picked:[],idx:0,answers:[],submitted:false,filter:'all',rate:null,correct:0,prevRate:null};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');}catch(e){return[];}}
function saveHistory(h){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(-40)));}catch(e){}}
function lastRate(){const h=loadHistory();return h.length?h[h.length-1].rate:null;}

function newRound(){
  const idxs=shuffle(BANK.map((_,i)=>i)).slice(0,TOTAL);
  state={picked:idxs.map(i=>Object.assign({},BANK[i])),idx:0,answers:new Array(TOTAL).fill(null),submitted:false,filter:'all',rate:null,correct:0,prevRate:lastRate()};
  renderQuiz();window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuiz(){
  const app=document.getElementById('app');
  const q=state.picked[state.idx];
  const answered=state.answers.filter(a=>a!==null).length;
  const pct=Math.round(answered/TOTAL*100);
  const dots=state.picked.map((_,i)=>{let cls='dot';if(i===state.idx)cls+=' cur';else if(state.answers[i]!==null)cls+=' ans';return'<button class="'+cls+'" data-act="goto" data-i="'+i+'" title="第 '+(i+1)+' 题"></button>';}).join('');
  app.innerHTML='<section class="card"><div class="qhead"><span class="qnum">第 '+(state.idx+1)+' / '+TOTAL+' 题</span><span class="qtag">'+q.t+'</span></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div class="qtext math">'+tex(q.q)+'</div><div class="options" id="opts">'+q.o.map((t,i)=>'<button class="opt'+(state.answers[state.idx]===i?' sel':'')+'" data-act="pick" data-i="'+i+'"><span class="badge">'+LETTERS[i]+'</span><span class="otext math">'+tex(t)+'</span></button>').join('')+'</div><div class="nav"><button class="btn ghost" data-act="prev"'+(state.idx===0?' disabled':'')+'>← 上一题</button><div class="dots">'+dots+'</div><button class="btn ghost" data-act="next"'+(state.idx===TOTAL-1?' disabled':'')+'>下一题 →</button></div><div class="submit-row"><button class="btn primary big" data-act="submit">提交答卷 · 已答 '+answered+'/'+TOTAL+'</button></div></section>';
}

function selectOption(i){
  if(state.submitted)return;
  state.answers[state.idx]=i;
  document.querySelectorAll('#opts .opt').forEach((b,k)=>{b.classList.toggle('sel',k===i);});
  const answered=state.answers.filter(a=>a!==null).length;
  const bar=document.querySelector('.progress .bar');if(bar)bar.style.width=Math.round(answered/TOTAL*100)+'%';
  const sb=document.querySelector('[data-act="submit"]');if(sb)sb.textContent='提交答卷 · 已答 '+answered+'/'+TOTAL;
  document.querySelectorAll('.dot').forEach((d,k)=>{if(k!==state.idx)d.classList.toggle('ans',state.answers[k]!==null);});
}

function submitPaper(){
  const blank=state.answers.filter(a=>a===null).length;
  const msg=blank>0?'还有 '+blank+' 题未作答，未作答按错误计分。确定提交吗？':'确定提交答卷并查看结果吗？';
  if(!confirm(msg))return;
  state.submitted=true;
  let correct=0;
  state.picked.forEach((q,i)=>{if(state.answers[i]===q.a)correct++;});
  const rate=Math.round(correct/TOTAL*100);
  state.correct=correct;state.rate=rate;
  const hist=loadHistory();
  state.prevRate=hist.length?hist[hist.length-1].rate:null;
  hist.push({rate:rate,correct:correct,total:TOTAL,time:Date.now()});
  saveHistory(hist);
  renderResult();window.scrollTo({top:0,behavior:'smooth'});
}

function renderResult(){
  const app=document.getElementById('app');
  const correct=state.correct;
  const blank=state.answers.filter(a=>a===null).length;
  const wrong=TOTAL-correct-blank;
  const rate=state.rate;
  const hist=loadHistory();
  const best=hist.reduce((m,x)=>Math.max(m,x.rate),0);
  const ring=rate>=80?'#10b981':(rate>=60?'#f59e0b':'#ef4444');
  let compareHtml='';
  if(state.prevRate===null){compareHtml='<div class="history-compare same">📌 这是你的首次测评，成绩已保存为基准分（'+rate+'%）。继续加油！</div>';}
  else{const d=rate-state.prevRate;
    if(d>0){compareHtml='<div class="history-compare up">📈 比上次提升 <b>'+d+'</b> 个百分点（上次 '+state.prevRate+'% → 本次 '+rate+'%）</div>';}
    else if(d<0){compareHtml='<div class="history-compare down">📉 比上次下降 <b>'+Math.abs(d)+'</b> 个百分点（上次 '+state.prevRate+'% → 本次 '+rate+'%）</div>';}
    else{compareHtml='<div class="history-compare same">➖ 与上次持平（均为 '+rate+'%）</div>';}
  }
  const items=state.picked.map((q,i)=>reviewItemHtml(q,i)).join('');
  const wrongCount=wrong+blank;
  app.innerHTML='<section class="card"><div class="result-top"><div class="score-ring" style="--p:'+rate+';--ring:'+ring+'"><div class="score-inner"><span class="score-num" style="color:'+ring+'">'+rate+'%</span><span class="score-label">正确率</span></div></div><div class="result-info"><h2>测评完成 🎉</h2><p class="sub">共 '+TOTAL+' 题，答对 '+correct+' 题</p><div class="stat-grid"><div class="stat ok"><b>'+correct+'</b><span>答对</span></div><div class="stat bad"><b>'+wrong+'</b><span>答错</span></div><div class="stat mute"><b>'+blank+'</b><span>未作答</span></div><div class="stat best"><b>'+best+'%</b><span>历史最高</span></div></div>'+compareHtml+'</div></div><div class="review-head"><h3>📝 逐题解析与错题回顾</h3><div class="filters"><button class="chip active" data-act="filter" data-f="all">全部 '+TOTAL+' 题</button><button class="chip" data-act="filter" data-f="wrong">只看错题（'+wrongCount+'）</button></div></div><div class="review-list" id="reviewList">'+items+'</div><div class="result-actions"><button class="btn primary big" data-act="again">🔁 再来一次（重新随机）</button><button class="btn ghost big" data-act="bank">📚 查看完整题库</button></div></section>';
}

function reviewItemHtml(q,i){
  const ua=state.answers[i];
  const ok=(ua===q.a);
  const opts=q.o.map((t,j)=>{let cls='ri-opt';if(j===q.a)cls+=' right';if(j===ua&&!ok)cls+=' wrong';let tag='';if(j===q.a&&!ok)tag+='<em>正确答案</em>';if(j===ua&&!ok)tag+='<em class="u">你的选择</em>';if(j===ua&&ok)tag+='<em>你的选择 ✓</em>';return'<div class="'+cls+'"><span class="badge">'+LETTERS[j]+'</span><span class="math">'+tex(t)+'</span>'+tag+'</div>';}).join('');
  const badge=ok?'✓ 回答正确':(ua===null?'— 未作答':'✗ 回答错误');
  return'<div class="review-item '+(ok?'is-ok':'is-bad')+'" data-ok="'+(ok?1:0)+'"><div class="ri-head"><span class="ri-no">第 '+(i+1)+' 题 · '+q.t+'</span><span class="ri-badge">'+badge+'</span></div><div class="ri-q math">'+tex(q.q)+'</div><div class="ri-opts">'+opts+'</div><div class="ri-exp"><b>解析：</b><span class="math">'+tex(q.e)+'</span></div><div class="ri-tip"><b>学习建议：</b>'+(TIPS[q.t]||'')+'</div></div>';
}

function applyFilter(){document.querySelectorAll('#reviewList .review-item').forEach(el=>{el.style.display=(state.filter==='wrong'&&el.dataset.ok==='1')?'none':'';});}

function openBank(){
  const body=document.getElementById('bankBody');
  body.innerHTML=BANK.map((q,i)=>'<div class="review-item"><div class="ri-head"><span class="ri-no">第 '+(i+1)+' 题 · '+q.t+'</span><span class="ri-badge" style="background:#e0e7ff;color:#3730a3">答案 '+LETTERS[q.a]+'</span></div><div class="ri-q math">'+tex(q.q)+'</div><div class="ri-opts">'+q.o.map((t,j)=>'<div class="ri-opt'+(j===q.a?' right':'')+'"><span class="badge">'+LETTERS[j]+'</span><span class="math">'+tex(t)+'</span>'+(j===q.a?'<em>答案</em>':'')+'</div>').join('')+'</div><div class="ri-exp"><b>解析：</b><span class="math">'+tex(q.e)+'</span></div></div>').join('');
  document.getElementById('bankCount').textContent=BANK.length;
  document.getElementById('bankModal').classList.add('open');
  body.scrollTop=0;
}
function closeBank(){document.getElementById('bankModal').classList.remove('open');}

/* ===== ⑤ 事件绑定 ===== */
document.getElementById('app').addEventListener('click',function(e){
  const optEl=e.target.closest('.opt');
  if(optEl&&!state.submitted){selectOption(Number(optEl.dataset.i));return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='pick'){selectOption(Number(el.dataset.i));}
  else if(act==='prev'){if(state.idx>0){state.idx--;renderQuiz();}}
  else if(act==='next'){if(state.idx<TOTAL-1){state.idx++;renderQuiz();}}
  else if(act==='goto'){state.idx=Number(el.dataset.i);renderQuiz();}
  else if(act==='submit'){submitPaper();}
  else if(act==='filter'){state.filter=el.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===el));applyFilter();}
  else if(act==='again'){newRound();}
  else if(act==='bank'){openBank();}
});
document.getElementById('btnBank').addEventListener('click',openBank);
document.getElementById('btnCloseBank').addEventListener('click',closeBank);
document.getElementById('bankModal').addEventListener('click',function(e){if(e.target===this)closeBank();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeBank();});
document.getElementById('btnReshuffle').addEventListener('click',function(){
  if(!state.submitted&&state.answers.some(a=>a!==null)){if(!confirm('重新随机将清空当前作答记录，确定吗？'))return;}
  newRound();
});
newRound();
</script>
</body>
